    <!-- =====================================
         Footer
    ====================================== -->

<!-- بيانات المطور -->

<div class="developer-credit">

</div>
    <!-- =================================

    <nav class="bottom-nav">


        <a

        </a>

<!-- =====================================
     قسم مساعدي سنتر الدحيح
===================================== -->

<a
            href="assistants.html"
            class="nav-item"
        >

            <span class="nav-icon">
                🏃
            </span>

            <span>
                الحجز
            </span>

        </a>

        <a
            href="account.html"
            class="nav-item"
        >

            <span class="nav-icon">
                👤
            </span>

            <span>
                حسابي
            </span>

        </a>


    </nav>


    <!-- =====================================
         JavaScript
    ====================================== -->

    <script src="assistants.js"></script>
 <script src="data.js"></script>

    <script src="home.js"></script>

    <script>


        /* =====================================
           عنصر الكروت
        ===================================== */

        const assistantsContainer =
            document.getElementById(
                "assistantsContainer"
            );



        /* =====================================
           عرض الـ Assistants
        ===================================== */

        function displayAssistants() {


            if (!assistantsContainer) {

                return;

            }


            assistantsContainer.innerHTML = "";



            assistants.forEach(
                function (assistant) {


                    /* =============================
                       إنشاء الكارت
                    ============================= */

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "teacher-card assistant-card";



                    /* =============================
                       الصورة
                    ============================= */

                    let imageHTML = "";


                    if (
                        assistant.image &&
                        assistant.image.trim() !== ""
                    ) {

                        imageHTML = `

                            <div class="teacher-image-container">

                                <img
                                    src="${assistant.image}"
                                    alt="${assistant.name}"
                                    class="teacher-image"
                                >

                            </div>

                        `;

                    } else {

                        imageHTML = `

                            <div class="teacher-image-container">

                                <div class="assistant-empty-image">

                                    👤

                                </div>

                            </div>

                        `;

                    }



                    /* =============================
                       رابط واتساب
                    ============================= */

                    const whatsappLink =
                        getWhatsAppLink(
                            assistant.whatsapp
                        );



                    /* =============================
                       الكارت
                    ============================= */

                    card.innerHTML = `

                        ${imageHTML}


                        <div class="teacher-info">


                            <h3>

                                ${assistant.name}

                            </h3>


                            <p class="teacher-subject">

                                ${assistant.role}

                            </p>


                            <div class="assistant-phone">

                                📱

                                ${assistant.whatsapp}

                            </div>


                            <div class="teacher-buttons">


                                <a
                                    href="${whatsappLink}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="subscribe-btn assistant-whatsapp-btn"
                                >

                                    💬 تواصل على واتساب

                                </a>


                            </div>


                        </div>

                    `;


                    assistantsContainer.appendChild(
                        card
                    );

                }
            );

        }



        /* =====================================
           تشغيل الصفحة
        ====================================== */

        displayAssistants();


 
   </script>
   

</body>

</html>
